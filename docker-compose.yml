services:
  mysql:
    image: mysql:8.4

    container_name: jobs247-mysql

    restart: unless-stopped

    command: --default-time-zone=+07:00

    environment:
      TZ: Asia/Ho_Chi_Minh

      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .

    container_name: jobs247-backend

    depends_on:
      mysql:
        condition: service_healthy

    env_file:
      - .env

    environment:
      DB_HOST: mysql
      DB_PORT: 3306

    ports:
      - "8080:8080"

volumes:
  mysql_data:
