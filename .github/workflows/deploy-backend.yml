name: Deploy Jobs247 Backend

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  IMAGE_NAME: jobs247-backend

jobs:
  build:
    name: Build Application

    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build application
        run: ./mvnw clean package -DskipTests

  build-and-push:
    name: Build and Push Docker Image

    needs: build

    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/jobs247-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/jobs247-backend:${{ github.sha }}

  deploy:
    name: Deploy to EC2

    needs: build-and-push

    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Copy Docker Compose to EC2
        run: |
          scp \
            -i ~/.ssh/id_rsa \
            docker-compose.prod.yml \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/opt/jobs247/

      - name: Deploy Application
        run: |
          ssh -i ~/.ssh/id_rsa \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
            "set -euo pipefail

            cd /opt/jobs247

            if [ ! -f .env ]; then
              echo 'Missing /opt/jobs247/.env on EC2'
              exit 1
            fi

            echo '${{ secrets.DOCKERHUB_TOKEN }}' | docker login -u '${{ secrets.DOCKERHUB_USERNAME }}' --password-stdin

            export DOCKERHUB_USERNAME='${{ secrets.DOCKERHUB_USERNAME }}'

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker compose -f docker-compose.prod.yml ps
            docker image prune -f
            "
