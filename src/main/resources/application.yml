server:
  port: ${SERVER_PORT}
  forward-headers-strategy: framework
  servlet:
    context-path: /
  tomcat:
    max-http-form-post-size: 50MB
    max-swallow-size: 50MB
    max-part-count: 200
    max-parameter-count: 1000

spring:
  application:
    name: recruitment
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?allowPublicKeyRetrieval=true&useSSL=false&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100
        one-indexed-parameters: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
      enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}
  email-verification-expiration: ${JWT_EMAIL_VERIFICATION_EXPIRATION:900000}

app:
  seed-admin: ${SEED_ADMIN}
  auth:
    otp-expiration: ${OTP_EXPIRATION:600000}
    otp-resend-cooldown: ${OTP_RESEND_COOLDOWN:60000}
    # false khi FE/BE chạy HTTP (Secure cookie cần HTTPS)
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
  mail:
    queue-enabled: ${MAIL_QUEUE_ENABLED:false}
  fcm:
    enabled: ${FCM_ENABLED:false}
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
  cache:
    hot-jobs-ttl-seconds: ${HOT_JOBS_CACHE_TTL_SECONDS:120}
    provinces-ttl-seconds: ${PROVINCES_CACHE_TTL_SECONDS:21600}
    industry-groups-ttl-seconds: ${INDUSTRY_GROUPS_CACHE_TTL_SECONDS:21600}
    education-levels-ttl-seconds: ${EDUCATION_LEVELS_CACHE_TTL_SECONDS:21600}
    business-config-ttl-seconds: ${BUSINESS_CONFIG_CACHE_TTL_SECONDS:3600}

aws:
  region: ${AWS_REGION}
  access-key: ${AWS_ACCESS_KEY}
  secret-key: ${AWS_SECRET_KEY}
  s3:
    bucket: ${AWS_S3_BUCKET}
    public-base-url: ${AWS_S3_PUBLIC_BASE_URL}

file-upload:
  max-image-size-bytes: 10485760
  allowed-image-content-types: image/jpeg,image/png,image/webp,image/gif
  allowed-image-extensions: jpg,jpeg,png,webp,gif
  max-document-size-bytes: 10485760
  allowed-document-content-types: application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document
  allowed-document-extensions: pdf,doc,docx

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

springdoc:
  swagger-ui:
    persist-authorization: true
    enabled: true
