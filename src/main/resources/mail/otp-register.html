<h1 style="margin:0 0 12px;font-size:22px;line-height:1.35;font-weight:700;color:#0b1f3a;">{{heading}}</h1>
<p style="margin:0 0 22px;font-size:15px;line-height:1.6;color:#3d4a5c;">{{intro}}</p>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 20px;">
  <tr>
    <td align="center" style="background:#f3f7fc;border:1px solid #d7e3f4;border-radius:10px;padding:18px 12px;">
      <div style="font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#5b6b7c;margin-bottom:8px;">{{codeLabel}}</div>
      <div style="font-size:32px;letter-spacing:10px;font-weight:700;color:#0b1f3a;font-family:Consolas,Courier New,monospace;">{{code}}</div>
    </td>
  </tr>
</table>
<p style="margin:0;font-size:13px;line-height:1.6;color:#5b6b7c;">{{expiry}}</p>
