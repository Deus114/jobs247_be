<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{subject}}</title>
</head>
<body style="margin:0;padding:0;background:#eef2f6;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{preheader}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#eef2f6;padding:32px 12px;">
  <tr>
    <td align="center">
      <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background:#ffffff;border:1px solid #e3e8ef;border-radius:12px;">
        <tr>
          <td style="padding:28px 32px 8px;text-align:center;font-family:Arial,Helvetica,sans-serif;">
            {{brand}}
          </td>
        </tr>
        <tr>
          <td style="padding:8px 32px 28px;font-family:Arial,Helvetica,sans-serif;">
            {{content}}
          </td>
        </tr>
        <tr>
          <td style="padding:16px 32px 22px;background:#f7f9fb;border-top:1px solid #e8edf3;text-align:center;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.6;color:#6b7785;">
            {{footer}}
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
