<h1 style="margin:0 0 12px;font-size:22px;line-height:1.35;font-weight:700;color:#0b1f3a;">{{heading}}</h1>
<p style="margin:0 0 16px;font-size:15px;line-height:1.6;color:#3d4a5c;">{{intro}}</p>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 16px;background:#f3f7fc;border:1px solid #d7e3f4;border-radius:10px;">
  <tr>
    <td style="padding:14px 16px;font-size:14px;line-height:1.6;color:#0b1f3a;">
      <div><strong>{{jobLabel}}</strong> {{jobTitle}}</div>
      <div style="margin-top:6px;"><strong>{{companyLabel}}</strong> {{companyName}}</div>
    </td>
  </tr>
</table>
<p style="margin:0;font-size:13px;line-height:1.6;color:#5b6b7c;">{{outro}}</p>
